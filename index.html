<style>

w:0 12px 30px #102a4312}.artimg{height:205px;width:100%;object-fit:cover;display:block;background:#e3e5e5}.artinfo{padding:13px}.artinfo h3,.instcard h3{font:600 16px 'Playfair Display',serif;color:var(--navy);margin:0 0 5px}.artinfo p,.instcard p{font-size:10px;color:var(--muted);margin:0}.tag{display:inline-block;background:#f4eeef;color:var(--red);font-size:9px;padding:5px 8px;border-radius:3px;margin-top:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat,.panel,.instcard{padding:17px;background:white;border:1px solid var(--line);border-radius:5px}.stat label{font-size:10px;color:var(--muted)}.stat strong{display:block;font:600 26px 'Playfair Display',serif;color:var(--navy);margin:9px 0 5px}.stat small{font-size:9px;color:var(--green)}.panel{margin-bottom:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panelhead h3{font-size:17px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:580px}th{text-align:left;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #eff0ef;font-size:11px}tr:last-child td{border:0}.status{display:inline-flex;padding:5px 8px;border-radius:14px;background:#f5f0e6;color:#80632d;font-size:9px}.status.approved,.status.published,.status.accepted{background:#e9f2ee;color:var(--green)}.status.rejected,.status.declined{background:#f7ebec;color:var(--red)}.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.search{min-width:220px;flex:1;max-width:360px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:white}.eventlist{display:grid;gap:11px}.event{display:grid;grid-template-columns:86px 1fr auto;gap:15px;align-items:center;background:white;padding:13px;border:1px solid var(--line);border-radius:5px}.event img{width:86px;height:72px;object-fit:cover;border-radius:3px}.datebox{color:var(--red);font-size:9px;text-transform:uppercase;letter-spacing:1px}.event h3{font:600 17px 'Playfair Display',serif;color:var(--navy);margin:5px 0}.event p{font-size:10px;color:var(--muted);margin:0}.instcard{padding:19px}.seal{width:42px;height:42px;border:1px solid #d5dde1;border-radius:50%;display:grid;place-items:center;color:var(--navy);font:600 15px 'Playfair Display',serif}.instcard h3{margin:13px 0 4px}.instmeta{border-top:1px solid var(--line);margin-top:13px;padding-top:11px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.empty{padding:45px;text-align:center;color:var(--muted);font-size:12px}.collabcall{padding:23px;background:var(--navy);color:white;border-radius:5px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:15px}.collabcall h3{font:600 20px 'Playfair Display',serif;margin:0 0 6px}.collabcall p{font-size:10px;color:#ced9e1;margin:0}.messages{display:grid;grid-template-columns:240px 1fr;min-height:400px;padding:0}.thread{padding:14px;border:1px solid var(--line);cursor:pointer}.thread.active{background:#f8f5f3}.thread b{font-size:11px;color:var(--navy)}.thread small{display:block;color:var(--muted);font-size:9px;margin-top:6px}.chat{padding:18px;display:flex;flex-direction:column}.bubble{max-width:75%;padding:11px 13px;background:#f0f3f5;border-radius:6px;margin:6px 0;font-size:11px;line-height:1.6}.bubble.mine{align-self:flex-end;background:var(--navy);color:white}.chatform{display:flex;margin-top:auto;gap:8px}.chatform input{flex:1;border:1px solid var(--line);padding:11px;border-radius:4px}.notice{position:fixed;right:20px;bottom:20px;z-index:8;background:var(--navy);color:white;padding:13px 17px;border-radius:5px;box-shadow:0 12px 35px #102a4330;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.notice.show{opacity:1;transform:none}.modalback{position:fixed;inset:0;z-index:7;background:#102a4366;display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:6px;padding:24px}.modal h2{font:600 23px 'Playfair Display',serif;color:var(--navy);margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:600}.field input,.field textarea,.field select{padding:10px;border:1px solid var(--line);border-radius:4px}.field textarea{resize:vertical;min-height:75px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.footer{border-top:1px solid var(--line);padding:22px 0;margin-top:42px;display:flex;justify-content:space-between;color:var(--muted);font-size:9px}

</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="brandmark">A</div><div><b>ALU GALLERY</b><small>ART IN CONVERSATION</small></div></div><div class="navlabel">Discover</div>
<button class="navbtn active" data-page="Home"><span>⌂</span><span>Home</span></button><button class="navbtn" data-page="Gallery"><span>▧</span><span>Explore gallery</span></button><button class="navbtn" data-page="Artists"><span>◉</span><span>Artists</span></button><button class="navbtn" data-page="Exhibitions"><span>▤</span><span>Exhibitions</span></button><button class="navbtn" data-page="Institutions"><span>▥</span><span>Institutions</span></button><button class="navbtn" data-page="Events"><span>▦</span><span>Events</span></button><div class="navlabel">Workspace</div><button class="navbtn" data-page="Dashboard"><span>▦</span><span>Dashboard</span></button><button class="navbtn" data-page="Submissions"><span>↑</span><span>Submissions</span></button><button class="navbtn" data-page="Collaborations"><span>◎</span><span>Collaborations</span></button><button class="navbtn" data-page="Messages"><span>▱</span><span>Messages</span></button><div class="profilemini"><img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Profile"><div><b id="userName">Visitor</b><small id="userRole">Public visitor</small></div></div></aside><main class="main"><header class="top"><div class="crumb">ALU Gallery <span style="margin:0 8px;color:#c1c8cd">/</span><strong id="crumb">Home</strong></div><div class="topright"><button class="iconbtn" id="notif" aria-label="Notifications">♧<i class="dot"></i></button></div></header><div class="content" id="app"></div></main></div><div id="notice" class="notice"></div><div id="modal"></div>
<script>
const P=['photo-1541961017774-22349e4a1262','photo-1579783902614-a3fb3927b6a5','photo-1577083552431-6e5fd01aa342','photo-1578301978693-85fa9c0320b9','photo-1577083288073-40892c0860a4','photo-1579783901586-d88db74b4fe4','photo-1549490349-8643362247b5'];const img=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=900&q=82`;
const boot=window.__ALU_BOOTSTRAP__||{};let db={artworks:boot.artworks||[],exhibitions:boot.exhibitions||[],institutions:(boot.institutions||[]).map(i=>({...i,artists:0,approved:i.status==='approved'})),events:(boot.events||[]).map(e=>({...e,image:'',registered:false})),submissions:boot.submissions||[],requests:boot.collaborations||[],messages:[]},page='Home',role=boot.user?.role==='gallery_admin'?'Gallery admin':boot.user?.role==='institution_admin'?'Institution admin':boot.user?.role==='artist'?'Artist':'Public visitor',filter='',signedUser=boot.user||null;const save=()=>{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){let n=document.querySelector('#notice');n.textContent=s;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2400)}function stat(s){return `<span class="status ${s.toLowerCase().replaceAll(' ','-')}">${esc(s)}</span>`}function head(k,t,d,action=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>${action}</div>`}
function cards(a){return a.length?`<div class="grid">${a.map(x=>`<article class="artcard"><img class="artimg" src="${esc(x.image)}" alt="Artwork: ${esc(x.title)}"><div class="artinfo"><h3>${esc(x.title)}</h3><p>${esc(x.artist)} · ${esc(x.category)}</p><span class="tag">${esc(x.status)}</span></div></article>`).join('')}</div>`:'<div class="empty">No artworks found.</div>'}
function events(a){return `<div class="eventlist">${a.map(e=>`<div class="event"><img src="${esc(e.image||img(P[3]))}" alt=""><div><div class="datebox">${esc(e.date)} · ${esc(e.kind||'Gallery event')}</div><h3>${esc(e.title)}</h3><p>${esc(e.place)} · ${e.registered?'You are registered':''}</p></div><button class="btn small ${e.registered?'outline':''}" data-event="${esc(e.title)}">${e.registered?'Cancel':'Register'}</button></div>`).join('')||'<div class="empty">No events to show.</div>'}</div>`}
function home(){return `${head('African Leadership University','A space for art to connect us.','Discover the artists, ideas and shared perspectives shaping contemporary African art.')}<section class="hero"><div class="eyebrow">A living collection</div><h2>Art in conversation<br>with the world.</h2><p>Explore work from a growing community of artists, universities and cultural institutions across Africa.</p><button class="btn" data-go="Gallery">Explore the gallery →</button></section><div class="sectionhead"><h2>Selected works</h2><button class="textbtn" data-go="Gallery">View all works →</button></div>${cards(db.artworks.filter(a=>a.status==='Published').slice(0,4))}<div class="sectionhead"><h2>What's happening</h2><button class="textbtn" data-go="Events">All events →</button></div>${events(db.events.slice(0,2))}<footer class="footer"><span>© 2026 ALU Gallery · African Leadership University</span><span>Art, community and shared perspectives.</span></footer>`}
function gallery(){let a=db.artworks.filter(x=>x.status==='Published'&&`${x.title} ${x.artist} ${x.category}`.toLowerCase().includes(filter.toLowerCase()));return `${head('Discover','Explore the gallery','Browse selected works from artists across our creative community.',role==='Artist'?'<button class="btn" data-modal="art">＋ Add artwork</button>':'')}<div class="toolbar"><input id="search" class="search" placeholder="Search artworks or artists" value="${esc(filter)}"><select id="catfilter" class="filter"><option value="">All disciplines</option>${[...new Set(db.artworks.map(x=>x.category))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>${cards(a)}`}
function artists(){return `${head('Creative community','Meet the artists','Artists sharing their vision and creative practice with the world.')}<div class="grid">${[...new Set(db.artworks.map(a=>a.artist))].map((n,i)=>`<article class="instcard"><img class="avatar" style="width:55px;height:55px" src="${img(P[i%P.length])}" alt="Portrait"><h3>${esc(n)}</h3><p>Contemporary artist · ${db.artworks.filter(a=>a.artist===n).length} works in the gallery</p><div class="instmeta"><span>Artist portfolio</span><button class="textbtn" data-artist="${esc(n)}">View works →</button></div></article>`).join('')}</div>`}
function exhibitionPage(){return `${head('Curated experiences','Exhibitions','Explore current calls and upcoming exhibitions.',role==='Gallery admin'?'<button class="btn" data-modal="exhibition">＋ Create exhibition</button>':'')}<div class="grid">${db.exhibitions.map(e=>`<article class="instcard"><div class="eyebrow">${esc(e.status)}</div><h3>${esc(e.title)}</h3><p>${esc(e.theme)}<br>${esc(e.place)}</p><div class="instmeta"><span>${esc(e.date)}</span><button class="textbtn" data-submit>Submit work →</button></div></article>`).join('')}</div>`}
function institutions(){return `${head('Our network','Partner institutions','A growing network of universities and cultural organizations.',role==='Gallery admin'?'<button class="btn" data-modal="institution">＋ Add institution</button>':'')}<div class="toolbar"><input id="search" class="search" placeholder="Search institutions" value="${esc(filter)}"></div><div class="grid">${db.institutions.filter(x=>x.name.toLowerCase().includes(filter.toLowerCase())).map(i=>`<article class="instcard"><div class="seal">${esc(i.name.split(' ').slice(0,2).map(w=>w[0]).join(''))}</div><h3>${esc(i.name)}</h3><p>${esc(i.type)} · ${esc(i.location)}</p><div class="instmeta"><span>${i.artists} affiliated artists</span>${i.approved?stat('Approved'):stat('Pending')}</div></article>`).join('')}</div>`}
function submissionTable(a,actions){return `<div class="tablewrap"><table><thead><tr><th>Artwork</th><th>Artist</th><th>Exhibition</th><th>Date</th><th>Status</th>${actions?'<th>Review</th>':''}</tr></thead><tbody>${a.map((s,i)=>`<tr><td>${esc(s.title)}</td><td>${esc(s.artist)}</td><td>${esc(s.exhibition)}</td><td>${esc(s.date||'Today')}</td><td>${stat(s.status)}</td>${actions?`<td><button class="textbtn" data-review="${i}">Review</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6">No submissions yet.</td></tr>'}</tbody></table></div>`}
function dashboard(){let n=db.submissions.filter(s=>['Submitted','Under review'].includes(s.status)).length;return `${head('Gallery administration','Overview','A snapshot of activity across your gallery network.')}<div class="stats">${[['Artists',new Set(db.artworks.map(a=>a.artist)).size,'In the collection'],['Institutions',db.institutions.length,'Partner network'],['Submissions',db.submissions.length,'All time'],['Awaiting review',n,'Requires attention']].map(x=>`<div class="stat"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="panel"><div class="panelhead"><h3>Recent submissions</h3><button class="textbtn" data-go="Submissions">Review submissions →</button></div>${submissionTable(db.submissions.slice(0,5),role==='Gallery admin')}</div><div class="panel"><div class="panelhead"><h3>Upcoming exhibitions</h3></div><div class="tablewrap"><table><thead><tr><th>Exhibition</th><th>Opening</th><th>Venue</th><th>Status</th></tr></thead><tbody>${db.exhibitions.map(e=>`<tr><td>${esc(e.title)}</td><td>${esc(e.date)}</td><td>${esc(e.place)}</td><td>${stat(e.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function submissions(){return '<div class="empty">Sign in to view submission activity.</div>';}
function collabs(){return `${head('Phase 2 · Collaboration','Working together','Build meaningful artistic partnerships across institutions.',role==='Institution admin'?'<button class="btn" data-modal="collab">＋ Propose collaboration</button>':'')}<div class="collabcall"><div><h3>Good art travels further together.</h3><p>Connect with partner institutions and create exhibitions that cross borders.</p></div><button class="btn" style="background:white;color:#102a43" data-modal="collab">Start a conversation</button></div><div class="panel"><div class="panelhead"><h3>Partnership requests</h3></div><div class="tablewrap"><table><thead><tr><th>Institution</th><th>Request</th><th>Details</th><th>Status</th>${role==='Gallery admin'?'<th>Action</th>':''}</tr></thead><tbody>${db.requests.map((r,i)=>`<tr><td>${esc(r.institution)}</td><td>${esc(r.type)}</td><td>${esc(r.detail)}</td><td>${stat(r.status)}</td>${role==='Gallery admin'?`<td><button class="textbtn" data-request="${i}">Review</button></td>`:''}</tr>`).join('')||'<tr><td colspan="5">No requests yet.</td></tr>'}</tbody></table></div></div><div class="panel"><div class="panelhead"><h3>Partner network</h3><button class="textbtn" data-go="Institutions">Browse institutions →</button></div><div class="grid">${db.institutions.map(i=>`<div><b>${esc(i.name)}</b><p>${esc(i.location)}</p></div>`).join('')}</div></div>`}
function messages(){return '<div class="empty">Sign in to view your authorized conversations.</div>';}
function render(){document.querySelector('#crumb').textContent=page;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let pages={Home:home,Gallery:gallery,Artists:artists,Exhibitions:exhibitionPage,Institutions:institutions,Events:()=>`${head('Gather and share','Events','Join artist talks, workshops and openings.',role==='Gallery admin'?'<button class="btn" data-modal="event">＋ Create event</button>':'')}${events(db.events)}`,Dashboard:dashboard,Submissions:submissions,Collaborations:collabs,Messages:messages};document.querySelector('#app').innerHTML=(pages[page]||home)();if(document.querySelector('#roleSelect'))document.querySelector('#roleSelect').value=role;document.querySelector('#userName').textContent=role==='Public visitor'?'Visitor':role==='Artist'?(signedUser?.fullName||'Artist'):role==='Institution admin'?'ALU Partner':'Gallery Admin';document.querySelector('#userRole').textContent=role;bind()}
function go(p){page=p;filter='';render();scrollTo(0,0)}
function modal(type){let map={art:['Add artwork',[['title','Artwork title'],['artist','Artist name'],['category','Discipline'],['image','Image URL'],['description','Description','textarea']],'Save artwork'],exhibition:['Create exhibition',[['title','Exhibition title'],['theme','Theme'],['date','Opening date','date'],['place','Venue'],['status','Status','select','Open for submissions,Upcoming,Published']],'Create exhibition'],institution:['Add institution',[['name','Institution name'],['type','Institution type'],['location','Country and city']],'Add institution'],event:['Create event',[['title','Event title'],['date','Date','date'],['place','Location'],['kind','Event type']],'Create event'],submission:['Submit artwork',[['title','Artwork title'],['exhibition','Exhibition'],['artist','Artist name']],'Submit for review'],collab:['Propose a collaboration',[['institution','Institution name'],['type','Collaboration type'],['detail','Tell us about your idea','textarea']],'Send proposal']},c=map[type];if(!c)return;document.querySelector('#modal').innerHTML=`<div class="modalback" id="backdrop"><section class="modal"><h2>${c[0]}</h2><form id="modalform"><div class="formgrid">${c[1].map(([n,l,k='text',o=''])=>`<div class="field ${k==='textarea'?'full':''}"><label>${l}</label>${k==='textarea'?`<textarea name="${n}" required></textarea>`:k==='select'?`<select name="${n}">${o.split(',').map(x=>`<option>${x}</option>`)}</select>`:`<input name="${n}" type="${k}" required>`}</div>`).join('')}</div><div class="formactions"><button type="button" class="btn outline" data-close>Cancel</button><button class="btn">${c[2]}</button></div></form></section></div>`;document.querySelector('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.querySelector('[data-close]').onclick=close;document.querySelector('#modalform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(type==='art'){db.artworks.unshift({...d,image:d.image||img(P[0]),status:'Pending review'});toast('Artwork saved for administrator review.')}if(type==='exhibition'){db.exhibitions.unshift({...d,status:d.status||'Upcoming'});toast('Exhibition created.')}if(type==='institution'){db.institutions.unshift({...d,artists:0,approved:false});toast('Institution added for verification.')}if(type==='event'){db.events.unshift({...d,image:img(P[1]),registered:false});toast('Event published.')}if(type==='submission'){db.submissions.unshift({...d,artist:d.artist||'Artist',status:'Submitted',date:new Date().toLocaleDateString()});toast('Submission sent for review.')}if(type==='collab'){db.requests.unshift({...d,status:'Pending'});toast('Collaboration proposal sent.')}save();close();render()}}
function close(){document.querySelector('#modal').innerHTML=''}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>modal(b.dataset.modal));let s=document.querySelector('#search');if(s)s.oninput=e=>{filter=e.target.value;render();let again=document.querySelector('#search');again?.focus();again?.setSelectionRange(filter.length,filter.length)};document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{let x=db.events.find(e=>e.title===b.dataset.event);x.registered=!x.registered;save();render();toast(x.registered?'You are registered.':'Registration cancelled.')});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{let x=db.submissions[+b.dataset.review],v=prompt(`Review ${x.title}: type Approved, Rejected, or Changes requested`,'Approved');if(['Approved','Rejected','Changes requested'].includes(v)){x.status=v;if(v==='Approved'){let a=db.artworks.find(a=>a.title===x.title);if(a)a.status='Published'}save();render();toast(`Submission ${v.toLowerCase()}.`)}});document.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>{let x=db.requests[+b.dataset.request],v=prompt('Set request status: Accepted or Declined','Accepted');if(['Accepted','Declined'].includes(v)){x.status=v;save();render()}});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>modal('submission'));document.querySelectorAll('[data-artist]').forEach(b=>b.onclick=()=>{filter=b.dataset.artist;go('Gallery');document.querySelector('#search').value=filter;document.querySelector('#search').dispatchEvent(new Event('input'))});document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.thread').forEach(x=>x.classList.remove('active'));b.classList.add('active')});let f=document.querySelector('#chatform');if(f)f.onsubmit=e=>{e.preventDefault();db.messages.push({text:new FormData(f).get('message'),mine:true});save();render()};let cat=document.querySelector('#catfilter');if(cat)cat.onchange=()=>{let q=document.querySelector('#search').value,a=db.artworks.filter(x=>x.status==='Published'&&(!cat.value||x.category===cat.value)&&`${x.title} ${x.artist}`.toLowerCase().includes(q.toLowerCase()));document.querySelector('.grid').outerHTML=cards(a)};let sf=document.querySelector('#subfilter');if(sf)sf.onchange=()=>{let a=sf.value==='All statuses'?db.submissions:db.submissions.filter(x=>x.status===sf.value);document.querySelector('#subtable').innerHTML=submissionTable(a,role==='Gallery admin');bind()}}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelector('#roleSelect')?.addEventListener('change',()=>{});document.querySelector('#notif').onclick=()=>toast('You are all caught up.');render();window.__aluBaseRender=render;window.__aluBaseSubmissions=submissions;
</script><script src="./enhancements.js"></script></body></html>
